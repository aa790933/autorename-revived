name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"
  RUST_VERSION: "stable"
  TAURI_ICON_SOURCE: "src-tauri/icons/icon-source.svg"

jobs:
  # ────────────────────────────────────────────────────────────
  # LINT & TYPE-CHECK (fast, runs on PRs)
  # ────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - name: Install dependencies
        shell: pwsh
        working-directory: gui
        run: pnpm install --frozen-lockfile
      - name: Run TypeScript type-check
        shell: pwsh
        working-directory: gui
        run: pnpm run typecheck
      - name: Run ESLint
        shell: pwsh
        working-directory: gui
        run: pnpm run lint

  # ────────────────────────────────────────────────────────────
  # BUILD GUI PORTABLE (native Rust Tauri app)
  # ────────────────────────────────────────────────────────────
  build-gui-portable:
    name: Build GUI Portable
    if: github.event_name != 'pull_request'
    needs: lint-and-typecheck
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/v") {
            $v = "${{ github.ref_name }}" -replace "^v", ""
          } else {
            $cargoToml = "src-tauri\Cargo.toml"
            if (Test-Path $cargoToml) {
              $content = Get-Content $cargoToml -Raw
              if ($content -match 'version\s*=\s*"([\d.]+)"') { $v = $Matches[1] } else { $v = "0.0.0" }
            } else { $v = "0.0.0" }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "VERSION=$v" >> $env:GITHUB_ENV
          "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Output "GUI version: $v"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: tauri-windows-portable
      - name: Install dependencies
        shell: pwsh
        working-directory: gui
        run: pnpm install --no-frozen-lockfile --config.store-dir=.\.pnpm-store
      - name: Build frontend (TypeScript + Vite)
        shell: pwsh
        working-directory: gui
        run: pnpm run build
      - name: Build Tauri GUI (portable)
        shell: pwsh
        working-directory: src-tauri
        run: node "../gui/node_modules/@tauri-apps/cli/tauri.js" build --target x86_64-pc-windows-msvc
      - name: Verify GUI EXE
        shell: pwsh
        run: |
          $exe = "src-tauri\target\x86_64-pc-windows-msvc\release\autorename-revived-gui.exe"
          if (-not (Test-Path $exe)) { throw "Tauri EXE not found" }
          $size = (Get-Item $exe).Length
          if ($size -lt 5MB) { throw "Tauri EXE undersized: $size bytes" }
          $peVer = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          $v = "$($peVer.FileMajorPart).$($peVer.FileMinorPart).$($peVer.FileBuildPart)"
          Write-Output "PASS: GUI v$v ($([math]::Round($size/1MB,1)) MB)"
      - name: Create portable ZIP (GUI only)
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $dir = "dist\portable"
          New-Item -ItemType Directory -Force -Path $dir
          Copy-Item "src-tauri\target\x86_64-pc-windows-msvc\release\autorename-revived-gui.exe" "$dir\AutoRename-Revived.exe" -Force
          # Create portable marker so settings.json is stored alongside the EXE
          Set-Content -Path "$dir\.portable" -Value "" -NoNewline
          Compress-Archive -Path "$dir\*" -DestinationPath "dist\AutoRename-v${v}-Portable.zip" -Force
          Write-Output "Portable ZIP created with $(Get-ChildItem $dir | Measure-Object | Select-Object -ExpandProperty Count) files"
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-portable-zip
          path: dist/AutoRename-v*-Portable.zip

  # ────────────────────────────────────────────────────────────
  # BUILD GUI INSTALLER (MSI)
  # ────────────────────────────────────────────────────────────
  build-gui-installer:
    name: Build GUI Installer
    if: github.event_name != 'pull_request'
    needs: lint-and-typecheck
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/v") {
            $v = "${{ github.ref_name }}" -replace "^v", ""
          } else {
            $cargoToml = "src-tauri\Cargo.toml"
            if (Test-Path $cargoToml) {
              $content = Get-Content $cargoToml -Raw
              if ($content -match 'version\s*=\s*"([\d.]+)"') { $v = $Matches[1] } else { $v = "0.0.0" }
            } else { $v = "0.0.0" }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "VERSION=$v" >> $env:GITHUB_ENV
          Write-Output "Installer version: $v"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: tauri-windows-installer
      - name: Install dependencies
        shell: pwsh
        working-directory: gui
        run: pnpm install --no-frozen-lockfile --config.store-dir=.\.pnpm-store
      - name: Build frontend (TypeScript + Vite)
        shell: pwsh
        working-directory: gui
        run: pnpm run build
      - name: Build Tauri MSI
        shell: pwsh
        working-directory: src-tauri
        run: node "../gui/node_modules/@tauri-apps/cli/tauri.js" build --target x86_64-pc-windows-msvc --bundles msi
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-msi
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  # ────────────────────────────────────────────────────────────
  # RELEASE — draft with all artifacts
  # ────────────────────────────────────────────────────────────
  release:
    name: Create Draft Release
    needs: [build-gui-portable, build-gui-installer]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/v") {
            $v = "${{ github.ref_name }}" -replace "^v", ""
          } else {
            $cargoToml = "src-tauri\Cargo.toml"
            if (Test-Path $cargoToml) {
              $content = Get-Content $cargoToml -Raw
              if ($content -match 'version\s*=\s*"([\d.]+)"') { $v = $Matches[1] } else { $v = "0.0.0" }
            } else { $v = "0.0.0" }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Output "Release: v$v"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\release
          Get-ChildItem -Path dist\artifacts -Recurse -File | ForEach-Object {
            Copy-Item $_.FullName "dist\release\$($_.Name)" -Force
            Write-Output "  $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)"
          }
          Write-Output "=== Release assets ==="
          Get-ChildItem dist\release | ForEach-Object { Write-Output "  $($_.Name)" }
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          name: AutoRename-Revived ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          body: |
            ## AutoRename-Revived ${{ steps.version.outputs.tag }}

            ### Assets

            | Artifact | Description |
            |----------|-------------|
            | `AutoRename-v${{ steps.version.outputs.version }}-Portable.zip` | Portable GUI (native Rust, no install needed) |
            | `*.msi` | Windows installer |

            ### Quick Start

            1. Download `AutoRename-v${{ steps.version.outputs.version }}-Portable.zip`
            2. Extract anywhere
            3. Run `AutoRename-Revived.exe`

            ### Verification

            - GUI: PE version verified
            - MSI: valid size gate passed

            **Review this draft, edit if needed, then publish.**
          files: dist/release/*
          fail_on_unmatched_files: true